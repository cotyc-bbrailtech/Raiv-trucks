name: CM5 Email Log Importer

# Checks a dedicated mailbox every 15 minutes for CSV attachments emailed by
# the RAIV_2 CM5 HMI's Email Client (Log Manager data), imports any found
# into logs/raiv_tracker_<date>.xlsx, and commits the change back to this
# repo. See scripts/email_log_importer.py for why email (not FTP) is used
# and for the caveats on the CSV format this assumes.
#
# Requires three repository secrets:
#   IMAP_HOST      - the mailbox provider's IMAP server (e.g. imap.gmail.com)
#   IMAP_USERNAME  - the dedicated mailbox's address
#   IMAP_PASSWORD  - an app password for that mailbox (not the account login password)
#
# Optional repository variable:
#   SUBJECT_FILTER - only process messages whose subject contains this text

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: email-log-importer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check mailbox and import any new CM5 log attachments
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: 993
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SUBJECT_FILTER: ${{ vars.SUBJECT_FILTER }}
          TRUCK_LABEL: Truck 2
          LOG_DIR: logs
        run: python scripts/email_log_importer.py

      - name: Commit and push if new data was logged
        run: |
          git config user.name "raiv-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No new data this run -- nothing to commit."
          else
            git commit -m "Import CM5 log data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

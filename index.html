<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raiv-Tracker Fleet Dashboard</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
  }
  .status .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status.connected .dot { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .status.connecting .dot { background: var(--warn); box-shadow: 0 0 6px var(--warn); animation: pulse 1s infinite; }
  .status.error .dot { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  main {
    padding: 24px 28px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 80px 20px;
    font-size: 1rem;
  }
  .truck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }
  .truck-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .truck-card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 10px;
  }
  .truck-card-header h2 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .truck-card-header span {
    color: var(--muted);
    font-size: 0.75rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.87rem;
  }
  table tr:not(:last-child) td {
    border-bottom: 1px solid rgba(148,163,184,0.12);
  }
  table td {
    padding: 6px 0;
  }
  table td.tag-name {
    color: var(--muted);
    white-space: nowrap;
    padding-right: 12px;
  }
  table td.tag-value {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .badge.on { background: rgba(34,197,94,0.15); color: var(--good); }
  .badge.off { background: rgba(148,163,184,0.15); color: var(--muted); }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Raiv-Tracker Fleet Dashboard</h1>
    <p>Live equipment feedback from Raiv-Truck PLCs via StrideLinx &rarr; MQTT (HiveMQ Cloud)</p>
  </div>
  <div id="status" class="status connecting">
    <span class="dot"></span>
    <span id="status-text">Connecting&hellip;</span>
  </div>
</header>

<main>
  <div id="empty-state" class="empty-state">Waiting for the first message from any truck&hellip;</div>
  <div id="truck-grid" class="truck-grid"></div>
</main>

<footer>
  Read-only live view. Values reflect whatever each truck last published — no history is stored on this page.
</footer>

<script>
  // ---- Connection config ------------------------------------------------
  // This page connects directly from the browser to HiveMQ Cloud over
  // MQTT-over-WebSockets using a dedicated, SUBSCRIBE-ONLY credential
  // ("Raiv-Dashboard-Public"). It cannot publish/write to the PLCs.
  // Because this page is public (GitHub Pages has no access wall on the
  // free tier), anyone with the link can read these live values -- that
  // trade-off was a deliberate choice to avoid running a paid always-on
  // server. If that ever needs to change, revoke/rotate this credential
  // in HiveMQ Cloud -> Access Management.
  const MQTT_HOST = "353a1aaf7a42437797d72a6699405ee1.s1.eu.hivemq.cloud";
  const MQTT_WSS_PORT = 8884;
  const MQTT_USERNAME = "Raiv-Dashboard-Public";
  const MQTT_PASSWORD = "V3WV1h7ZclzbBPfAP5sY";
  const TOPIC_FILTER = "raiv-tracker/#"; // subscribes to every truck automatically

  // ---- State --------------------------------------------------------------
  const trucks = {}; // { "truck-2": { metrics: {name: value}, lastSeen: Date } }

  const statusEl = document.getElementById("status");
  const statusTextEl = document.getElementById("status-text");
  const gridEl = document.getElementById("truck-grid");
  const emptyStateEl = document.getElementById("empty-state");

  function setStatus(kind, text) {
    statusEl.className = "status " + kind;
    statusTextEl.textContent = text;
  }

  function formatTruckLabel(topic) {
    // topic looks like "raiv-tracker/truck-2/plc" -> "Truck 2"
    const parts = topic.split("/");
    const rawId = parts[1] || topic;
    const match = rawId.match(/(\d+)/);
    return match ? "Truck " + match[1] : rawId;
  }

  function formatValue(metric) {
    // Sparkplug-B datatype 11 = Boolean
    if (metric.datatype === 11 || typeof metric.value === "boolean") {
      const on = metric.value === true || metric.value === "true" || metric.value === 1;
      return '<span class="badge ' + (on ? "on" : "off") + '">' + (on ? "ON" : "OFF") + "</span>";
    }
    if (typeof metric.value === "number") {
      return Number.isInteger(metric.value) ? metric.value.toString() : metric.value.toFixed(3);
    }
    return String(metric.value);
  }

  function render() {
    const ids = Object.keys(trucks).sort();
    if (ids.length === 0) {
      emptyStateEl.style.display = "block";
      gridEl.innerHTML = "";
      return;
    }
    emptyStateEl.style.display = "none";

    gridEl.innerHTML = ids.map(function (id) {
      const truck = trucks[id];
      const metricNames = Object.keys(truck.metrics).sort();
      const rows = metricNames.map(function (name) {
        const m = truck.metrics[name];
        return "<tr><td class=\"tag-name\">" + name + "</td><td class=\"tag-value\">" + formatValue(m) + "</td></tr>";
      }).join("");
      const ageSec = Math.round((Date.now() - truck.lastSeen) / 1000);
      return (
        '<div class="truck-card">' +
          '<div class="truck-card-header"><h2>' + id + "</h2>" +
          "<span>updated " + ageSec + "s ago</span></div>" +
          "<table><tbody>" + (rows || '<tr><td class="tag-name">no tags yet</td></tr>') + "</tbody></table>" +
        "</div>"
      );
    }).join("");
  }

  // Re-render every second so the "updated Xs ago" labels stay fresh.
  setInterval(render, 1000);

  // ---- MQTT connection ------------------------------------------------
  const clientId = "raiv-dashboard-" + Math.random().toString(16).slice(2, 10);
  const url = "wss://" + MQTT_HOST + ":" + MQTT_WSS_PORT + "/mqtt";

  const client = mqtt.connect(url, {
    clientId: clientId,
    username: MQTT_USERNAME,
    password: MQTT_PASSWORD,
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 15000,
  });

  client.on("connect", function () {
    setStatus("connected", "Connected");
    client.subscribe(TOPIC_FILTER, { qos: 0 }, function (err) {
      if (err) {
        setStatus("error", "Subscribe failed: " + err.message);
      }
    });
  });

  client.on("reconnect", function () {
    setStatus("connecting", "Reconnecting…");
  });

  client.on("close", function () {
    setStatus("connecting", "Disconnected – retrying…");
  });

  client.on("error", function (err) {
    setStatus("error", "Connection error");
    console.error("MQTT error:", err);
  });

  client.on("message", function (topic, payloadBuffer) {
    let payload;
    try {
      payload = JSON.parse(payloadBuffer.toString());
    } catch (e) {
      console.warn("Non-JSON message on", topic, payloadBuffer.toString());
      return;
    }

    const truckId = formatTruckLabel(topic);
    if (!trucks[truckId]) {
      trucks[truckId] = { metrics: {}, lastSeen: Date.now() };
    }
    trucks[truckId].lastSeen = Date.now();

    const metrics = Array.isArray(payload.metrics) ? payload.metrics : [payload];
    metrics.forEach(function (m) {
      if (m && m.name) {
        trucks[truckId].metrics[m.name] = m;
      }
    });

    render();
  });
</script>

</body>
</html>
